<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduDesk - Profile</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Sidebar -->
    <nav class="sidebar">
        <div class="nav-header">
            <img src="assets/logo.png" alt="EduDesk Logo" class="logo" height="50px">
            <button class="nav-toggle" id="navToggle"><i class="fas fa-times"></i></button>
        </div>
        <ul class="nav-menu">
            <li><a href="dashboard.html" class="nav-link">
                <i class="fas fa-chart-line nav-icon"></i>
                <span class="nav-text">Dashboard</span>
            </a></li>
            <li><a href="courses.html" class="nav-link">
                <i class="fas fa-book nav-icon"></i>
                <span class="nav-text">Courses</span>
            </a></li>
            <li><a href="assignments.html" class="nav-link">
                <i class="fas fa-pen nav-icon"></i>
                <span class="nav-text">Assignments</span>
            </a></li>
            <li><a href="attendance.html" class="nav-link">
                <i class="fas fa-calendar-check nav-icon"></i>
                <span class="nav-text">Attendance</span>
            </a></li>
            <li><a href="profile.html" class="nav-link active">
                <i class="fas fa-user nav-icon"></i>
                <span class="nav-text">Profile</span>
            </a></li>
            <li><a href="index.html" class="nav-link logout">
                <i class="fas fa-sign-out-alt nav-icon"></i>
                <span class="nav-text">Logout</span>
            </a></li>
        </ul>
    </nav>

    <main class="main-content">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Profile Content -->
        <div class="profile-container">
            <div class="profile-overview">
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <img src="https://www.shutterstock.com/image-vector/profile-icon-account-vector-illustration-600nw-2201573727.jpg" alt="Profile" id="avatarPreview">
                            <div class="avatar-overlay">
                                <i class="fas fa-camera"></i>
                            </div>
                        </div>
                        <div class="profile-info">
                            <h2 id="namePreview">Shumaila</h2>
                            <p id="emailPreview">shumaila@gmail.com</p>
                            <span class="student-id" id="studentIdPreview">Student ID: STU001</span>
                        </div>
                    </div>
                    <div class="profile-stats">
                        <div class="stat-item">
                            <div class="stat-number">5</div>
                            <div class="stat-label">Courses</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">3.4</div>
                            <div class="stat-label">GPA</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">85%</div>
                            <div class="stat-label">Attendance</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile Form -->
            <div class="profile-form-section">
                <div class="form-container">
                    <div class="form-header">
                        <h3>Edit Profile Information</h3>
                        <p>Update your personal details and preferences</p>
                    </div>
                    
                    <form id="profileForm" class="profile-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name</label>
                                <input type="text" id="firstName" name="firstName" value="Shumaila" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name</label>
                                <input type="text" id="lastName" name="lastName" value="" placeholder="Enter last name">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email" value="shumaila@gmail.com" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" name="phone" value="" placeholder="Enter phone number">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="studentId">Student ID</label>
                                <input type="text" id="studentId" name="studentId" value="STU001" readonly>
                            </div>
                            <div class="form-group">
                                <label for="semester">Semester</label>
                                <select id="semester" name="semester">
                                    <option value="Fall 2024" selected>Fall 2024</option>
                                    <option value="Spring 2025">Spring 2025</option>
                                    <option value="Summer 2025">Summer 2025</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="major">Major</label>
                                <input type="text" id="major" name="major" value="Computer Science" required>
                            </div>
                            <div class="form-group">
                                <label for="dateOfBirth">Date of Birth</label>
                                <input type="date" id="dateOfBirth" name="dateOfBirth" value="">
                            </div>
                        </div>
                        
                        <div class="form-group full-width">
                            <label for="address">Address</label>
                            <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea>
                        </div>
                        
                        <div class="form-group full-width">
                            <label for="bio">Bio</label>
                            <textarea id="bio" name="bio" rows="4" placeholder="Tell us about yourself..."></textarea>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
