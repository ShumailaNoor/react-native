<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            Dynamic List
        </title>
    </head>
    <body>
        <input type="text" id="input" placeholder="Enter element">
        <button type="submit" id="btn">Add</button>
        <ul id="list"></ul>
        <script>
            function createDynamicList(){
                let input = document.getElementById('input');
                let button = document.getElementById('btn');
                let list = document.getElementById('list');
                function addItem(){
                    let newItem = input.value.trim();
                    if (newItem === ''){
                        alert("Pleae Enter value");
                        return;
                    }
                    let lisItems = document.createElement('li');
                    lisItems.textContent = newItem;

                    list.appendChild(lisItems);

                    input.value = '';
                }
                button.addEventListener('click', addItem);
                input.addEventListener('keydown', function(event){
                    if (event.key === 'Enter'){
                        addItem();
                    }
                });
            }
            createDynamicList();
        </script>
    </body>
</html>
