<!DOCTYPE html>
<html>
    <head>
        <title>To Do list</title>
    </head>
    <body>
        <input type="text" id="todoInput" placeholder="Enter task">
        <button id="addTodo">Add Task</button>
        <ul id="todoList"></ul>
        <script>
function createTodoList() {
    let input = document.getElementById('todoInput');
    let addButton = document.getElementById('addTodo');
    let list = document.getElementById('todoList');
    let todoCounter = 0;
    
    function addTodo() {
        let taskText = input.value.trim();
        
        if (taskText === '') {
            alert("Please enter a task");
            return;
        }
        
        todoCounter++;
        
        let listItem = document.createElement('li');
        listItem.innerHTML = `
            <span class="task-text">${taskText}</span>
            <button class="done-btn" data-id="${todoCounter}">Done</button>
            <button class="delete-btn" data-id="${todoCounter}">Delete</button>
        `;
        
        list.appendChild(listItem);
        
        input.value = '';
    }
    
    list.addEventListener('click', function(event) {
        let target = event.target;
        
        if (target.classList.contains('done-btn')) {
            let taskSpan = target.parentElement.querySelector('.task-text');
            taskSpan.style.textDecoration = 'line-through';
            taskSpan.style.opacity = '0.6';
            target.disabled = true;
            target.textContent = 'Completed';
        }
        
        if (target.classList.contains('delete-btn')) {
            target.parentElement.remove();
        }
    });
    
    addButton.addEventListener('click', addTodo);
    
    input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            addTodo();
        }
    });
}

createTodoList();
        </script>
    </body>
</html>
