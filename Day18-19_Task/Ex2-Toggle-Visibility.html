<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Toggle Visibility</title>
    </head>
    <body>
        <img id="image" height="200" width="200"
        src="https://plus.unsplash.com/premium_photo-1664474619075-644dd191935f?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8aW1hZ2V8ZW58MHx8MHx8fDA%3D">
        <button id="button">Hide</button>
        <script>
            function toggle(){
                let image = document.getElementById("image");
                let toggleButton = document.getElementById("button");
                toggleButton.addEventListener('click', ()=>{
                if (image.style.display === 'none') {
                    image.style.display = 'block';
                    toggleButton.textContent = 'Hide';
                } else {
                    image.style.display = 'none';
                    toggleButton.textContent = 'Show';
                 }
                })
            }
            toggle();
        </script>
    </body>
</html>
